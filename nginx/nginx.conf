events {}

http {
    # Punto de entrada unico del sistema.
    # El cliente solo habla con Nginx; el ControlNode no se expone directamente.
    # Nginx termina el TLS: expone HTTPS al cliente y reenvia en texto plano al
    # ControlNode por la red interna de Docker.

    upstream control_node {
        server control_node:8000;
    }

    # Todo el tráfico HTTP se redirige a HTTPS: el cliente nunca usa texto plano.
    server {
        listen 80;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;

        # Certificado autofirmado para uso académico. En producción se usaría un
        # certificado emitido por una autoridad de confianza.
        ssl_certificate     /etc/nginx/certs/dfsha.crt;
        ssl_certificate_key /etc/nginx/certs/dfsha.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        # Sin límite de tamaño para las subidas (PUT). Por defecto Nginx rechaza
        # con 413 cualquier petición de más de 1 MB, y los archivos del DFS
        # pueden pesar varios cientos de MB.
        client_max_body_size 0;

        # Archivos grandes tardan en subir y en reconstruirse: se amplían los
        # tiempos de espera (por defecto son 60 s).
        proxy_connect_timeout 10s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        location / {
            # Reenvia todas las peticiones al ControlNode por la red interna de Docker
            proxy_pass http://control_node;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Las descargas (GET) se envían al cliente a medida que llegan, sin
            # que Nginx las guarde completas en su disco primero.
            proxy_buffering off;
        }
    }
}
