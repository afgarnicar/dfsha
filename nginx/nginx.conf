events {}

http {
    # Punto de entrada unico del sistema.
    # El cliente solo habla con Nginx; el ControlNode no se expone directamente.
    # Por ahora es un reverse proxy HTTP simple; el soporte HTTPS se agregará más adelante.

    upstream control_node {
        server control_node:8000;
    }

    server {
        listen 80;

        # Sin límite de tamaño para las subidas (PUT). Por defecto Nginx rechaza
        # con 413 cualquier petición de más de 1 MB, y los archivos del DFS
        # pueden pesar varios cientos de MB.
        client_max_body_size 0;

        # Archivos grandes tardan en subir y en reconstruirse: se amplían los
        # tiempos de espera (por defecto son 60 s).
        proxy_connect_timeout 10s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        location / {
            # Reenvia todas las peticiones al ControlNode por la red interna de Docker
            proxy_pass http://control_node;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Las descargas (GET) se envían al cliente a medida que llegan, sin
            # que Nginx las guarde completas en su disco primero.
            proxy_buffering off;
        }
    }
}
