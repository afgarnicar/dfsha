# Configuración de Alembic para las migraciones del ControlNode.
# La URL real de la base de datos se toma de la variable de entorno DATABASE_URL
# dentro de migrations/env.py; aquí no se escribe ninguna credencial.

[alembic]
# Ruta de los scripts de migración, relativa al directorio donde se ejecuta Alembic.
script_location = migrations

# Agrega el directorio de ejecución (/app en el contenedor) al sys.path para que
# env.py pueda importar los paquetes "app" y "shared".
prepend_sys_path = .

# Plantilla de nombre de archivo de las revisiones: fecha + descripción.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

# Zona horaria para los timestamps de las revisiones.
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
